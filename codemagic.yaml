# Codemagic CI configuration for MyAIChat (iOS app)
# Docs: https://docs.codemagic.io/yaml/yaml-getting-started/
#
# This file defines TWO workflows:
#
#   1) ios-simulator-test  -> Unsigned build for the iOS Simulator.
#                             Runs with NO credentials. Use it to verify the
#                             app compiles on CI.
#
#   2) ios-release         -> Signed build for a real iOS device that produces
#                             a distributable .ipa. Requires an App Store
#                             Connect API key integration and signing to be
#                             configured in the Codemagic UI (see notes below).

definitions:
  environment_defaults: &environment_defaults
    xcode: latest
    cocoapods: default
  common_vars: &common_vars
    XCODE_PROJECT: "MyAIChat.xcodeproj"
    XCODE_SCHEME: "MyAIChat"
    BUNDLE_ID: "com.example.MyAIChat"

workflows:

  # ---------------------------------------------------------------------------
  # 1) Credential-free compile check on the iOS Simulator.
  #    Great as a fast PR/CI gate; needs no signing assets.
  # ---------------------------------------------------------------------------
  ios-simulator-test:
    name: iOS Simulator Build (no signing)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      <<: *environment_defaults
      vars:
        <<: *common_vars
    scripts:
      - name: Build for iOS Simulator (unsigned)
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            clean build
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app

  # ---------------------------------------------------------------------------
  # 2) Signed device build -> produces an .ipa for iOS devices.
  #
  #    Before running this workflow, in the Codemagic UI:
  #      - Add an App Store Connect API key integration and set its name in
  #        `integrations.app_store_connect` below (here: "AppStoreConnectKey").
  #      - Make sure the bundle id `com.example.MyAIChat` exists in your
  #        Apple Developer account (or change BUNDLE_ID / bundle_identifier).
  #
  #    `distribution_type` can be: app_store | ad_hoc | development | enterprise
  # ---------------------------------------------------------------------------
  ios-release:
    name: iOS Release (Device IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: AppStoreConnectKey
    environment:
      <<: *environment_defaults
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.example.MyAIChat
      vars:
        <<: *common_vars
    scripts:
      - name: Fetch signing files and apply them to the Xcode project
        script: |
          xcode-project use-profiles
      - name: Build signed .ipa for device
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      - /tmp/xcodebuild_logs/*.log
    # publishing:
    #   # Uncomment and configure to upload the build automatically.
    #   app_store_connect:
    #     auth: integration
    #     submit_to_testflight: false
